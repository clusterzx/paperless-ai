# Builds Paperless-AI from this repository (also used by Coolify's "Docker Compose" build pack).
# To run the published image instead, replace `build: .` with `image: clusterzx/paperless-ai:latest`
# (NVIDIA GPU for OCR: `image: clusterzx/paperless-ai:latest-cuda` and the `deploy` block below).
services:
  paperless-ai:
    build: .
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges=true
    environment:
      - PAPERLESS_AI_PORT=3000
      # Behind a reverse proxy (Traefik, Caddy, nginx, Coolify, …): number of proxy hops.
      # - TRUST_PROXY=1
      # Everything else is configured in the web interface (setup wizard).
      # Settings can also be pinned with environment variables, e.g.:
      # - PAPERLESS_API_URL=http://paperless:8000
      # - PAPERLESS_API_TOKEN=...
      # - AI_PROVIDER=ollama
      # - OLLAMA_API_URL=http://host.docker.internal:11434
      # - OLLAMA_MODEL=qwen3:8b
      # OCR with PaddleOCR (also in Settings → OCR):
      # - OCR_ENABLED=true
      # - OCR_MODE=poor          # manual | missing | poor | always
    ports:
      # Host port: set PAPERLESS_AI_HOST_PORT if 3000 is taken (e.g. by another app or a 3.x instance).
      - "${PAPERLESS_AI_HOST_PORT:-3000}:3000"
    volumes:
      - paperless-ai_data:/app/data
    # Needed to reach Ollama running on the Docker host via host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # NVIDIA GPU for OCR (image :latest-cuda, NVIDIA Container Toolkit, driver ≥ 580):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  paperless-ai_data:
