name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Native build tools must not need AVX2/BMI2: source installs run on older CPUs (Celeron, Atom, old Xeons).
      - name: Build on an emulated x86-64-v2 CPU without AVX2/BMI2
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-user
          qemu-x86_64 -cpu Nehalem "$(readlink -f "$(command -v node)")" node_modules/vite/bin/vite.js build --outDir "$RUNNER_TEMP/web-x86-64-v2"
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
