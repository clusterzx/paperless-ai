name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Native build tools must not need AVX2/BMI2: source installs run on older CPUs (Celeron, Atom, old Xeons).
      # Emulated inside Debian (the base of our image): the runner's own libraries may be built for x86-64-v3.
      - name: Build on an emulated x86-64-v2 CPU without AVX2/BMI2
        run: |
          docker run --rm -v "$PWD":/src:ro -w /src node:22-bookworm-slim sh -ec '
            apt-get update -qq && apt-get install -y -qq --no-install-recommends qemu-user >/dev/null
            qemu-x86_64 -cpu Nehalem /usr/local/bin/node node_modules/vite/bin/vite.js build --configLoader runner --outDir /tmp/web'
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (companion mode)
        run: npm run test:e2e
      - name: End-to-end tests (built-in archive)
        run: npm run test:e2e:builtin
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
