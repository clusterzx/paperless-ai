on:
  release:
    types: [published]  # Only triggers when a release is published
  schedule:
    - cron: "0 0 * * *" # Nightly build
jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Default image (latest, 4.1.0, nightly) – runs everywhere, OCR on the CPU.
          - variant: cpu
            platforms: linux/amd64,linux/arm64
          # NVIDIA GPU image (latest-cuda, 4.1.0-cuda, nightly-cuda) – CUDA 13, amd64 only.
          - variant: cuda
            platforms: linux/amd64
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Free disk space for the CUDA base image
        if: matrix.variant == 'cuda'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: |
            ${{ secrets.DOCKER_USERNAME }}/paperless-ai
            ghcr.io/${{ github.repository_owner }}/paperless-ai
          flavor: |
            latest=false
          tags: |
            type=schedule,pattern=nightly,enable=${{ matrix.variant == 'cpu' }}
            type=schedule,pattern=nightly,suffix=-${{ matrix.variant }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' && matrix.variant == 'cpu' }}
            type=semver,pattern={{version}},suffix=-${{ matrix.variant }},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && matrix.variant == 'cpu' }}
            type=raw,value=latest-${{ matrix.variant }},enable=${{ github.event_name == 'release' }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          platforms: ${{ matrix.platforms }}
          build-args: |
            VARIANT=${{ matrix.variant }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
