name: Performance

# The built-in archive with 200,000 generated documents against the targets of
# docs/standalone/search-and-scale.md §6 (lists, full text, facets, vector search, event loop).
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 200k documents, 250k passages × 768
        run: npm run perf -- --documents 200000 --passages 250000 --dims 768 --dir "$RUNNER_TEMP/perf" --json perf.json --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-results
          path: perf.json
          if-no-files-found: ignore
